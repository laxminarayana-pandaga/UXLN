<footer class="footer">
  <div class="container footer__bar">
    <p class="footer__legal">
      <span class="footer__name">© {{ year }} {{ profile.name }}</span>
      <span class="footer__sep" aria-hidden="true">·</span>
      <span>All rights reserved</span>
    </p>

    <nav class="footer__links" aria-label="Footer">
      <ul role="list">
        @for (link of links; track link.path) {
          <li><a [routerLink]="link.path">{{ link.label }}</a></li>
        }
        <li>
          <a [href]="profile.linkedIn.url" target="_blank" rel="noopener noreferrer">
            LinkedIn <span class="visually-hidden">(opens in a new tab)</span>
          </a>
        </li>
      </ul>
    </nav>

    <button type="button" class="footer__top" (click)="backToTop()">
      Top <app-icon name="arrow-up" [size]="14" />
    </button>
  </div>
</footer>
