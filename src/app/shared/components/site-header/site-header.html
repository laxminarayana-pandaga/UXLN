<div class="bar container">
  <a class="brand" routerLink="/" aria-label="{{ name }} — home">
    <!-- <span class="brand__mark" aria-hidden="true">LP</span> -->
    <span class="brand-logo"><img class="brand-logo-img" src="/assets/images/lnLogo.svg" alt="Lakshmi Narayana Pandaga" /></span>
  </a>

  <button
    type="button"
    class="toggle"
    aria-controls="primary-nav"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
  </button>

  <nav id="primary-nav" class="nav" aria-label="Primary">
    <ul role="list" class="nav__list">
      @for (link of links; track link.path) {
        @if (link.path === '/contact') {
          <li>
            <a
              class="nav__link nav__link--resume"
              href="/LAKSHMI NARAYANA P - UX Designer - Resume.pdf"
              download
              aria-label="Download resume"
            >
              Resume
              <app-icon name="download" [size]="16" />
            </a>
          </li>
        }
        <li>
          <a
            class="nav__link"
            [class.nav__link--cta]="link.path === '/contact'"
            [routerLink]="link.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
          >
            {{ link.label }}
            @if (link.path === '/contact') {
              <app-icon name="arrow-up-right" [size]="16" />
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- <a class="social" [href]="linkedIn" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">
    <app-icon name="linkedin" [size]="15" />
  </a> -->
</div>
