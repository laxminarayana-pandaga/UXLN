<article class="card" [attr.aria-labelledby]="'project-' + project().slug">
  <div class="card__media">
    <app-media [asset]="project().cover" [ratio]="wide() ? '16 / 9' : '16 / 10'" />
  </div>

  <div class="card__body">
    <p class="card__meta">
      <span class="index-label">PROJECT / {{ index() | pad }}</span>
      <span class="card__category">{{ project().category }}</span>
    </p>

    <h3 class="card__title" [id]="'project-' + project().slug">
      <a class="card__link" [routerLink]="link()">{{ project().title }}</a>
    </h3>

    <p class="card__summary">{{ project().summary }}</p>

    <dl class="card__facts">
      <div>
        <dt>Role</dt>
        <dd class="card__role">{{ project().role }}</dd>
      </div>
      <div>
        <dt>Contribution</dt>
        <dd>{{ project().contributions.join(' · ') }}</dd>
      </div>
    </dl>

    <span class="card__cta" aria-hidden="true">
      View case study
      <app-icon name="arrow-right" [size]="14" />
    </span>
  </div>
</article>
